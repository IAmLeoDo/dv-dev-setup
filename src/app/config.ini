# Shared configuration for Ubuntu setup (dev.sh) and Windows WSL setup (dev.bat).
# Edit this file before first setup; later edit ~/.config/dv/config.ini.
# Keep secrets, tokens, and private keys out of configuration.
# See docs/content/configuration.md for the full configuration reference.
#
# Format:
# - Keep section headers and setting names exactly as shown.
# - Use full-line # comments. Do not append comments after a setting's value.
# - Booleans accept only true or false (lowercase).
# - Values are data: shell commands, substitutions, and escapes are not evaluated.
# - In [setup], literal $HOME expands to the Linux home directory; ~ does not.
# - [setup] values may have one matching pair of quotes; aliases/WSL values may not.
#
# Private overrides (the main file still supplies unspecified defaults):
# Ubuntu Bash: DV_CONFIG=/absolute/path/config.local.ini bash src/app/dev.sh setup
# Windows CMD: set "DV_CONFIG=C:\path with spaces\config.local.ini"
# Then run: src\app\dev.bat setup 3
# Windows PowerShell: $env:DV_CONFIG = 'C:\path with spaces\config.local.ini'
# Then run: .\src\app\dev.bat setup 3
# Commands above assume the repository root; see docs/content/usage.md for other layouts.

[setup]
# Runtime tools are copied here by setup/install; the active runtime is app/.
# User config is preserved separately in ~/.config/dv/config.ini.
# Must be an absolute Linux path, outside /mnt/. No sudo is needed.
# Example: DV_TOOLS_ROOT=$HOME/.local/share/dv-dev-setup
DV_TOOLS_ROOT=$HOME/.local/share/dv-dev-setup

# Ubuntu setup options. Existing environment variables take priority over this
# section; a DV_CONFIG override takes priority over this file's [setup] values.

# Organization label used by workspace/worktree commands.
# Start with a letter/digit; remaining characters: letters, digits, _ or -.
# Example: DV_ORG=my-team
DV_ORG=devimony

# Top-level workspace on the Linux filesystem. Must be absolute, not / or /mnt/.
# Setup also creates personal/ and experiments/ beneath this directory.
# Example: DV_WORKSPACE_ROOT=$HOME/workspace custom
DV_WORKSPACE_ROOT=$HOME/workspace

# Organization project directory. Change this separately when changing the
# organization or workspace root; other setting names are not expanded here.
# Example: DV_PROJECTS_ROOT=$HOME/workspace custom/my-team
DV_PROJECTS_ROOT=$HOME/workspace/devimony

# Comment attached to a newly generated SSH key; does not log in to GitHub.
# Example: DV_GITHUB_USER=your-github-name
DV_GITHUB_USER=iamleodo

# Global Git author name. Empty preserves the existing name.
# A conflicting existing value requires confirmation. Example: DV_GIT_NAME=Leo Dev
DV_GIT_NAME=

# Global Git author email. Empty preserves the existing email.
# Example: DV_GIT_EMAIL=leo@example.com
DV_GIT_EMAIL=

# Initial branch for new Git repositories, set only if init.defaultBranch is unset.
# Example: DV_GIT_DEFAULT_BRANCH=develop
DV_GIT_DEFAULT_BRANCH=main

# Exact Python 3 version to install through pyenv: 3.MINOR.PATCH.
# Must be supported by the installed pyenv; system Python is preserved.
# After setup, select it per project: pyenv local 3.13.12
DV_PYTHON_VERSION=3.13.12

# pyenv release tag used only when creating a new pyenv installation.
# Format/example: v2.8.7. Existing installations are not automatically upgraded.
DV_PYENV_VERSION=v2.8.7

# Node.js selection passed to nvm: lts/* or a numeric version (optional v prefix).
# Examples: DV_NODE_VERSION=22 or DV_NODE_VERSION=v22.14.0
# Pin a full version when projects need repeatable installations.
DV_NODE_VERSION=lts/*

# nvm release tag used only when creating a new nvm installation.
# Format/example: v0.40.4. Existing installations are not automatically upgraded.
DV_NVM_VERSION=v0.40.4

# Install/configure Git. false skips the git module, including --only git.
# Example: DV_INSTALL_GIT=false to keep Git setup outside this workflow.
DV_INSTALL_GIT=true

# Install SSH client/keychain and configure shell initialization and SSH template.
# false skips the ssh module; key creation is controlled separately below.
DV_INSTALL_SSH=true

# Install pyenv prerequisites and the selected Python version.
# false skips the python module; it does not uninstall existing Python versions.
DV_INSTALL_PYTHON=true

# Install nvm prerequisites and the selected Node.js version.
# false skips the node module; it does not uninstall existing Node.js versions.
DV_INSTALL_NODE=true

# Install/configure Docker Engine and Compose. Requires Ubuntu with systemd.
# false skips the docker module, including service configuration and Docker tests.
DV_INSTALL_DOCKER=true

# Generate Ubuntu Bash shortcuts from [aliases]. false skips the aliases module.
# This does not remove aliases from earlier runs. Apply just this module with:
# bash src/app/dev.sh setup --only aliases
DV_INSTALL_ALIASES=true

# Docker startup mode when the docker module runs:
# true: disable and stop docker.service/docker.socket after package installation.
# false: enable and start docker.service for automatic startup.
# Example: keep true and use dv docker start / dv docker stop when needed.
DV_DOCKER_ON_DEMAND=true

# Create ~/.ssh/id_ed25519 only when no key exists; existing keys are preserved.
# true normally prompts for a passphrase in a terminal; false skips key creation.
# Example: DV_SSH_GENERATE=true when setting up a new development account.
DV_SSH_GENERATE=false

# Separate opt-in to create a key with an empty passphrase. Used only when
# DV_SSH_GENERATE=true and no key exists. false keeps the passphrase prompt.
DV_SSH_NO_PASSPHRASE=false

# Test GitHub SSH authentication at the end of the ssh module.
# Example: set true after registering your public key and verifying/accepting
# GitHub's host key manually. The automated test uses strict host-key checking.
DV_GITHUB_TEST=false

# Run Docker hello-world and check Compose at the end of the docker module.
# true may download the hello-world image and starts Docker for the test.
# In on-demand mode, Docker is stopped afterward if it was stopped before testing.
DV_DOCKER_TEST=false

[aliases]
# Ubuntu/WSL Bash shortcuts: name=command. No quotes or inline comments.
# Names start with an ASCII letter; use only letters, digits, and underscores.
# Names must be unique. Values must exactly match one of the supported commands:
# dv help | dv doctor | dv versions | dv cleanup | dv workspace | dv workspace open
# dv docker start | dv docker stop | dv docker restart | dv docker status
# dv git status | dv worktree list | git status | git diff | git log --oneline
#
# Examples to add or rename (uncomment the assignment you want):
# dvr=dv docker restart
# wt=dv worktree list
# my_status=git status
# Extra arguments are supplied when using an alias, e.g. gd --stat.
# A [aliases] section in DV_CONFIG replaces this entire section, not individual
# entries. An empty section generates no aliases. Matching shell aliases are
# overridden when the generated file is loaded; choose names accordingly.
#
# Preview: bash src/app/dev.sh setup --only aliases --dry-run
# Apply:   bash src/app/dev.sh setup --only aliases
# Open a new Bash shell afterward. Generated file: ~/.config/dv/aliases.bash.
# Setup adds its source line once to ~/.bashrc. Reruns replace the generated file.
# Setup first copies the runtime to DV_TOOLS_ROOT/app; dv aliases use that copy.
# The source checkout or downloaded bundle can be moved after setup completes.

# Show dv help. Example: dvh
dvh=dv help
# Inspect tools and environment. Example: dvc
dvc=dv doctor
# Preview cleanup by default. Examples: dvclean all, dvclean all --keep dv
# Only --apply enables removal, with confirmation: dvclean all --keep dv --apply
dvclean=dv cleanup
# Show installed tool versions. Example: dvv
dvv=dv versions
# Print workspace and project roots. Example: dvw
dvw=dv workspace
# Open the organization project root in VS Code (requires code).
# Examples: dvwo (default root), dvwo ., dvwo ./frontend ./backend
# Add to the last active VS Code window: dvwo --add "$HOME/workspace/personal"
# Put paths/options on the command line; keep this alias target exactly as below.
dvwo=dv workspace open
# Start Docker through the dv command. Example: dvds
dvds=dv docker start
# Stop Docker service/socket. Save container work before using dvdt.
dvdt=dv docker stop
# Inspect Docker service state. Example: dvd
dvd=dv docker status
# Show Git working-tree status in the current repository. Example: gs --short
gs=git status
# Show unstaged changes. Examples: gd --stat or gd -- src/app/config.ini
gd=git diff
# Show compact Git history. Example: gl -5
gl=git log --oneline

[wsl2]
# Windows-only .wslconfig settings. Keep keys unique, without quotes or inline
# comments. Ubuntu setup does not apply these settings.
# Apply from CMD: src\app\dev.bat setup 3
# Apply from PowerShell: .\src\app\dev.bat setup 3
# The script asks for confirmation and backs up %USERPROFILE%\.wslconfig before
# replacement. Save WSL work, then run wsl --shutdown manually to apply changes.

# WSL2 memory limit. Accepted format: positive integer followed by MB or GB.
# Examples: memory=8GB or memory=8192MB. Choose a limit suitable for your host.
memory=12GB

# WSL2 swap size. Same units as memory; 0 disables swap.
# Examples: swap=2GB or swap=0.
swap=4GB

# Forward WSL services to Windows through localhost where supported by WSL.
# Example: localhostForwarding=false to disable this forwarding option.
localhostForwarding=true

[experimental]
# Windows WSL experimental setting, applied together with [wsl2].
# Memory reclaim mode: gradual, dropCache, or disabled.
# Example: autoMemoryReclaim=disabled to turn off this reclaim option.
autoMemoryReclaim=gradual

[ssh]
# Ubuntu SSH template: copied only when ~/.ssh/config does not exist.
# An existing SSH config is preserved. A [ssh] section in DV_CONFIG replaces the
# whole template. These are native SSH directives, not INI key=value assignments.
# Never put private-key content here; IdentityFile only points to a local key.

# Connection alias matched by ssh. Example usage: ssh -T git@github.com
Host github.com
    # Actual server to connect to. Keep github.com for the GitHub SSH endpoint.
    HostName github.com
    # Remote SSH account for GitHub Git operations; not your GitHub username.
    User git
    # Private-key path; ~ is interpreted by SSH. Never overwrite an existing key.
    # Example for a manually managed key: IdentityFile ~/.ssh/id_ed25519_work
    IdentityFile ~/.ssh/id_ed25519
    # Offer only the configured identity instead of unrelated agent keys.
    IdentitiesOnly yes
    # Add the loaded key to an available SSH agent; keychain initialization is
    # configured separately by the ssh module for ~/.ssh/id_ed25519.
    AddKeysToAgent yes

[vscode.extensions]
# Editor recommendations only: install manually, not by setup.
# A section override replaces this whole list. IDs below can be searched in the
# VS Code Extensions view. In WSL, use "Install in WSL" for guest-side extensions.

# Windows UI: connect VS Code to WSL; install on Windows first.
ms-vscode-remote.remote-wsl
# WSL/Ubuntu: Python editing and environment support.
ms-python.python
# WSL/Ubuntu: Python language analysis and completion.
ms-python.vscode-pylance
# WSL/Ubuntu: Bash linting integration; the shellcheck tool is installed separately.
timonwong.shellcheck
# WSL/Ubuntu: Docker/container tooling in the editor.
ms-azuretools.vscode-docker
# WSL/Ubuntu: Git history and repository navigation.
eamodio.gitlens

# Editor settings template below is plain JSON; keep comments outside its section.
# Merge selected properties into existing VS Code settings manually; do not replace
# the entire user settings file. A DV_CONFIG section override replaces this sample.
# Property guide and examples:
# - files.eol: use LF for Linux files ("\n"); preserve required CRLF for .bat files.
# - editor.formatOnSave: true formats on save; set false to format manually.
# - python.defaultInterpreterPath: project-relative virtual environment interpreter.
#   Example: "${workspaceFolder}/.venv/bin/python" for an Ubuntu .venv.
# - files.exclude: hide matching paths in Explorer; this does not delete files
#   or change Git ignore rules. Example: "**/__pycache__": true.
[vscode.settings]
{
  "files.eol": "\n",
  "editor.formatOnSave": true,
  "python.defaultInterpreterPath": "${workspaceFolder}/.venv/bin/python",
  "files.exclude": { "**/__pycache__": true }
}
